name: Deploy Frontend

on:
  push:
    branches: [main]

env:
  PROJECT_ID: orion-trading-dev
  PROJECT_NUMBER: 273043831761
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/orion-trading-dev/frontend-images/frontend
  SERVICE: orion-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-ci@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push
        run: |
          docker build \
            --build-arg VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }} \
            --build-arg VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }} \
            --build-arg VITE_MARKET_DATA_URL=${{ vars.VITE_MARKET_DATA_URL }} \
            --build-arg VITE_TRADING_ENGINE_URL=${{ vars.VITE_TRADING_ENGINE_URL }} \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --allow-unauthenticated \
            --service-account=orion-frontend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --port=8080
