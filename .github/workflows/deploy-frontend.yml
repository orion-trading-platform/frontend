name: Deploy Frontend

on:
  push:
    branches: [main]

env:
  PROJECT_ID: rice-comp-539-spring-2022
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/rice-comp-539-spring-2022/orion-images/frontend
  SERVICE: orion-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/904917579142/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-ci@rice-comp-539-spring-2022.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push
        run: |
          docker build \
            --build-arg VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }} \
            --build-arg VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }} \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --allow-unauthenticated \
            --service-account=orion-frontend-sa@rice-comp-539-spring-2022.iam.gserviceaccount.com
